<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" fill="none">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="45%" stop-color="#0a1c28"/>
      <stop offset="100%" stop-color="#07141c"/>
    </linearGradient>
    <radialGradient id="seaGlow" cx="48%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#1a4a5c" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#0a1c28" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5560"/>
      <stop offset="100%" stop-color="#2e353c"/>
    </linearGradient>
    <linearGradient id="vale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d4a5c"/>
      <stop offset="100%" stop-color="#2a3444"/>
    </linearGradient>
    <linearGradient id="westerlands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4030"/>
      <stop offset="100%" stop-color="#342c20"/>
    </linearGradient>
    <linearGradient id="reach" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a32"/>
      <stop offset="100%" stop-color="#2a3524"/>
    </linearGradient>
    <linearGradient id="storm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3830"/>
      <stop offset="100%" stop-color="#2a2820"/>
    </linearGradient>
    <linearGradient id="dorne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4030"/>
      <stop offset="100%" stop-color="#3e2c20"/>
    </linearGradient>
    <linearGradient id="essosLand" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#3e3830"/>
      <stop offset="55%" stop-color="#4a3c28"/>
      <stop offset="100%" stop-color="#3a3024"/>
    </linearGradient>
    <linearGradient id="dothraki" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#4a4830"/>
      <stop offset="100%" stop-color="#3a3824"/>
    </linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2030"/>
      <stop offset="100%" stop-color="#1a1420"/>
    </linearGradient>
    <linearGradient id="wallIce" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8c8d8"/>
      <stop offset="50%" stop-color="#e8f4fa"/>
      <stop offset="100%" stop-color="#7aa0b4"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="waves" width="40" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 10 Q10 4 20 10 T40 10" stroke="#c9a227" stroke-opacity=".06" fill="none" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Ocean -->
  <rect width="1000" height="700" fill="url(#sea)"/>
  <rect width="1000" height="700" fill="url(#seaGlow)"/>
  <rect width="1000" height="700" fill="url(#waves)"/>

  <!-- Subtle chart grid -->
  <g stroke="#c9a227" stroke-opacity=".04" stroke-width="1">
    <path d="M0 70 H1000 M0 140 H1000 M0 210 H1000 M0 280 H1000 M0 350 H1000 M0 420 H1000 M0 490 H1000 M0 560 H1000 M0 630 H1000"/>
    <path d="M70 0 V700 M140 0 V700 M210 0 V700 M280 0 V700 M350 0 V700 M420 0 V700 M490 0 V700 M560 0 V700 M630 0 V700 M700 0 V700 M770 0 V700 M840 0 V700 M910 0 V700"/>
  </g>

  <!-- ===== WESTEROS (more detailed silhouette) ===== -->
  <!-- Beyond the Wall / Lands of Always Winter -->
  <path fill="#3a4450" stroke="#c9a227" stroke-opacity=".25" stroke-width="1"
    d="M165 28 L210 22 L255 30 L275 48 L268 70 L230 78 L185 72 L155 55 Z"/>

  <!-- The Wall -->
  <path d="M158 78 L278 78" stroke="url(#wallIce)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M158 78 L278 78" stroke="#e8f4fa" stroke-width="1.2" stroke-opacity=".7"/>

  <!-- The North -->
  <path fill="url(#north)" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.4"
    d="M155 82 L278 82 L295 110 L288 150 L300 185 L275 215 L255 245 L240 275 L210 295 L175 285 L145 255 L125 220 L118 180 L130 140 L145 110 Z"/>

  <!-- The Neck (swamp tint) -->
  <path fill="#2a3834" stroke="#c9a227" stroke-opacity=".25" stroke-width="1"
    d="M175 285 L240 275 L248 300 L235 325 L200 335 L170 320 Z"/>

  <!-- The Vale -->
  <path fill="url(#vale)" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.3"
    d="M248 300 L290 280 L325 295 L340 330 L325 365 L290 375 L255 355 L235 325 Z"/>

  <!-- Riverlands -->
  <path fill="#354038" stroke="#c9a227" stroke-opacity=".35" stroke-width="1.2"
    d="M170 320 L235 325 L250 355 L230 385 L195 400 L160 385 L145 350 Z"/>

  <!-- Iron Islands -->
  <g fill="#2a3038" stroke="#c9a227" stroke-opacity=".4" stroke-width="1">
    <ellipse cx="105" cy="300" rx="16" ry="8"/>
    <ellipse cx="128" cy="312" rx="11" ry="6"/>
    <ellipse cx="95" cy="318" rx="8" ry="5"/>
    <ellipse cx="118" cy="288" rx="7" ry="4"/>
  </g>

  <!-- Westerlands -->
  <path fill="url(#westerlands)" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.3"
    d="M145 350 L195 400 L185 440 L155 465 L120 450 L105 410 L118 375 Z"/>

  <!-- Crownlands -->
  <path fill="#3a3530" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.3"
    d="M230 385 L290 375 L310 400 L305 435 L275 455 L245 445 L220 420 Z"/>

  <!-- The Reach -->
  <path fill="url(#reach)" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.3"
    d="M155 465 L185 440 L220 420 L245 445 L240 490 L210 530 L170 545 L140 520 L135 485 Z"/>

  <!-- Stormlands -->
  <path fill="url(#storm)" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.3"
    d="M275 455 L305 435 L330 460 L340 500 L320 540 L285 555 L255 530 L245 490 Z"/>

  <!-- Dorne -->
  <path fill="url(#dorne)" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.3"
    d="M170 545 L210 530 L255 530 L285 555 L300 585 L275 615 L230 630 L185 615 L160 580 Z"/>

  <!-- Dragonstone -->
  <ellipse cx="355" cy="400" rx="16" ry="12" fill="#3a3038" stroke="#8b1e1e" stroke-opacity=".55" stroke-width="1.5"/>
  <path d="M355 390 L358 400 L355 408 L352 400 Z" fill="#8b1e1e" fill-opacity=".45"/>

  <!-- Mountains of the Moon -->
  <g fill="#5a6878" fill-opacity=".55" stroke="#c9a227" stroke-opacity=".2" stroke-width=".8">
    <path d="M280 310 L292 285 L304 310 Z"/>
    <path d="M300 325 L315 295 L330 325 Z"/>
    <path d="M265 340 L275 318 L285 340 Z"/>
  </g>

  <!-- Northern hills -->
  <g fill="#5a6570" fill-opacity=".4" stroke="none">
    <path d="M190 140 L205 115 L220 140 Z"/>
    <path d="M230 160 L242 138 L254 160 Z"/>
    <path d="M170 190 L182 170 L194 190 Z"/>
  </g>

  <!-- Rivers -->
  <g fill="none" stroke="#1a5060" stroke-opacity=".55" stroke-width="2" stroke-linecap="round">
    <!-- Trident -->
    <path d="M200 335 C215 350 230 360 250 355"/>
    <path d="M215 340 C205 360 190 380 175 390"/>
    <path d="M225 345 C235 365 250 380 265 390"/>
    <!-- Blackwater -->
    <path d="M200 430 C230 435 260 440 290 430"/>
    <!-- Mander -->
    <path d="M175 500 C200 490 220 480 245 470"/>
  </g>

  <!-- ===== ESSOS ===== -->
  <!-- Free Cities / western Essos -->
  <path fill="url(#essosLand)" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.4"
    d="M500 95 L560 75 L620 85 L680 110 L700 160 L690 220 L670 280 L655 340 L640 400 L620 450 L590 490 L555 510 L520 480 L505 420 L500 350 L495 280 L490 200 L495 140 Z"/>

  <!-- Braavos lagoon islands hint -->
  <g fill="#2a3038" stroke="#c9a227" stroke-opacity=".3" stroke-width=".8">
    <ellipse cx="545" cy="155" rx="10" ry="5"/>
    <ellipse cx="560" cy="148" rx="7" ry="4"/>
    <ellipse cx="535" cy="165" rx="6" ry="3"/>
  </g>

  <!-- Dothraki Sea -->
  <path fill="url(#dothraki)" stroke="#c9a227" stroke-opacity=".35" stroke-width="1.3"
    d="M680 110 L760 100 L840 130 L890 180 L910 240 L900 300 L860 340 L790 350 L720 330 L690 280 L700 200 Z"/>

  <!-- Grass texture hints -->
  <g stroke="#6a6840" stroke-opacity=".2" stroke-width="1" fill="none">
    <path d="M740 180 Q750 170 760 180"/>
    <path d="M780 220 Q790 210 800 220"/>
    <path d="M820 260 Q830 250 840 260"/>
    <path d="M760 280 Q770 270 780 280"/>
  </g>

  <!-- Slaver's Bay / Ghiscari -->
  <path fill="#4a3830" stroke="#c9a227" stroke-opacity=".4" stroke-width="1.3"
    d="M720 330 L790 350 L830 390 L850 450 L820 500 L760 520 L710 500 L690 450 L700 390 Z"/>

  <!-- Red Waste tint -->
  <path fill="#5a3828" fill-opacity=".7" stroke="#c9a227" stroke-opacity=".25" stroke-width="1"
    d="M790 350 L860 340 L900 360 L910 400 L880 430 L830 420 L800 390 Z"/>

  <!-- Shadow Lands / Asshai -->
  <path fill="url(#shadow)" stroke="#6a4080" stroke-opacity=".45" stroke-width="1.3"
    d="M850 450 L910 430 L950 470 L960 530 L930 570 L880 560 L850 520 Z"/>

  <!-- Mother of Mountains -->
  <g fill="#5a5040" fill-opacity=".6" stroke="#c9a227" stroke-opacity=".25" stroke-width=".8">
    <path d="M820 230 L845 185 L870 230 Z"/>
    <path d="M850 245 L868 210 L886 245 Z"/>
  </g>

  <!-- Narrow Sea depth -->
  <ellipse cx="420" cy="380" rx="70" ry="120" fill="#0d3040" fill-opacity=".25"/>

  <!-- Coastline edge glow -->
  <g fill="none" stroke="#c9a227" stroke-opacity=".12" stroke-width="3">
    <path d="M155 82 L278 82 L295 110 L288 150 L300 185 L275 215 L255 245 L240 275 L290 280 L325 295 L340 330 L325 365 L310 400 L305 435 L330 460 L340 500 L320 540 L300 585 L275 615 L230 630 L185 615 L160 580 L170 545 L140 520 L135 485 L120 450 L105 410 L118 375 L145 350 L125 220 L118 180 L130 140 L145 110 Z"/>
  </g>

  <!-- Region labels -->
  <g fill="#c9a227" fill-opacity=".42" font-family="Georgia, 'Times New Roman', serif" letter-spacing="3" text-anchor="middle">
    <text x="210" y="175" font-size="11">THE NORTH</text>
    <text x="295" y="335" font-size="9">THE VALE</text>
    <text x="185" y="365" font-size="8">RIVERLANDS</text>
    <text x="145" y="425" font-size="8">WESTERLANDS</text>
    <text x="260" y="420" font-size="8">CROWNLANDS</text>
    <text x="185" y="500" font-size="9">THE REACH</text>
    <text x="300" y="500" font-size="8">STORMLANDS</text>
    <text x="230" y="585" font-size="10">DORNE</text>
    <text x="580" y="280" font-size="10">FREE CITIES</text>
    <text x="790" y="250" font-size="10">DOTHRAKI SEA</text>
    <text x="770" y="455" font-size="9">SLAVER'S BAY</text>
    <text x="905" y="510" font-size="8">SHADOW</text>
  </g>

  <!-- Continent titles -->
  <text x="200" y="660" fill="#c9a227" fill-opacity=".65" font-family="Georgia, serif" font-size="20" letter-spacing="8" text-anchor="middle">WESTEROS</text>
  <text x="740" y="90" fill="#c9a227" fill-opacity=".65" font-family="Georgia, serif" font-size="20" letter-spacing="8" text-anchor="middle">ESSOS</text>

  <!-- Sea labels -->
  <g fill="#7a9088" fill-opacity=".45" font-family="Georgia, serif" font-size="10" font-style="italic" text-anchor="middle">
    <text x="420" y="360">Narrow Sea</text>
    <text x="220" y="55" font-size="8">Beyond the Wall</text>
    <text x="355" y="430" font-size="7" fill="#a07070" fill-opacity=".6">Dragonstone</text>
    <text x="280" y="95" font-size="7" fill="#a8c8d8" fill-opacity=".55">The Wall</text>
    <text x="420" y="620">Summer Sea</text>
    <text x="90" y="280" font-size="7" transform="rotate(-55 90 280)">Sunset Sea</text>
  </g>

  <!-- Decorative compass -->
  <g transform="translate(920, 80)" opacity=".55">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#c9a227" stroke-width="1" stroke-opacity=".5"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#c9a227" stroke-width=".6" stroke-opacity=".35"/>
    <path d="M0 -14 L3 0 L0 14 L-3 0 Z" fill="#c9a227" fill-opacity=".5"/>
    <path d="M-14 0 L0 -3 L14 0 L0 3 Z" fill="#c9a227" fill-opacity=".3"/>
    <text x="0" y="-28" fill="#c9a227" fill-opacity=".7" font-family="Georgia, serif" font-size="8" text-anchor="middle">N</text>
  </g>
</svg>
